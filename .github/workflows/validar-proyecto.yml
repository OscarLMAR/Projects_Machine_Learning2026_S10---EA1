
name: Ejecutar notebooks EA1 y EA2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejecutar-notebooks-ea1-ea2-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install nbconvert nbformat jupyter

      - name: Limpiar datos y reportes generados
        run: |
          mkdir -p src/sincronizar/datos
          mkdir -p src/sincronizar/reportes
          mkdir -p sincronizar/reportes
          find src/sincronizar/datos -mindepth 1 -delete
          find src/sincronizar/reportes -mindepth 1 -delete
          find sincronizar/reportes -mindepth 1 -delete

      - name: Ejecutar notebook de carga de datos
        working-directory: src/sincronizar
        run: |
          ../../.venv/bin/python -m jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            EA1_Carga_de_Datos.ipynb

      - name: Ejecutar notebook EA2
        working-directory: src/sincronizar
        run: |
          ../../.venv/bin/python -m jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            EA2_Carga_de_Datos.ipynb

      - name: Confirmar cambios generados
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/sincronizar/datos \
                  src/sincronizar/reportes \
                  sincronizar/reportes/arriendo-por-estrato-colombia-2026.txt \
                  src/sincronizar/EA1_Carga_de_Datos.ipynb \
                  src/sincronizar/EA2_Carga_de_Datos.ipynb

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados de carga de datos [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
