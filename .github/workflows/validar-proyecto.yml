
name: Ejecutar Semana 1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejecutar-semana-1-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install nbconvert nbformat jupyter

      - name: Crear carpetas de resultados
        run: |
          mkdir -p src/sincronizar/datos
          mkdir -p src/sincronizar/reportes

      - name: Ejecutar notebook de carga de datos
        working-directory: src/sincronizar
        run: |
          ../../.venv/bin/python -m jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            EA1_Carga_de_Datos.ipynb

      - name: Confirmar cambios generados
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/sincronizar/datos \
                  src/sincronizar/reportes \
                  src/sincronizar/EA1_Carga_de_Datos.ipynb

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados de carga de datos [skip ci]"
          git push origin HEAD:main
